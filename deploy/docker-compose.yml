services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pymes
      POSTGRES_PASSWORD: pymes
      POSTGRES_DB: pymes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pymes -d pymes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pymes:pymes@postgres:5432/pymes?sslmode=disable
      JWT_SECRET: change-me-to-at-least-32-bytes-long-secret
      JWT_EXPIRY: 24h
      PORT: "8080"
      UPLOAD_DIR: /data/uploads
      BCRYPT_COST: "12"
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
